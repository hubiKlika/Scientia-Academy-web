<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="/images/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/images/favicon.png?v=2" />

    <!-- VIEWPORT -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Scientia Academy</title>
    <meta name="description" content="Szkolenia GCP dla zespołów badań klinicznych. Scientia Academy – praktyczna wiedza, realne wdrożenia." />

    <!-- (opcjonalnie lepsze pod social media) -->
    <meta property="og:title" content="Scientia Academy" />
    <meta property="og:description" content="Szkolenia GCP dla zespołów badań klinicznych." />
    <meta property="og:type" content="website" />
  </head>

  <body>
    <div id="root"></div>

    <!-- NETLIFY FORM (hidden, żeby działało z Reactem) -->
    <form name="kontakt" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="kontakt" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="type" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
